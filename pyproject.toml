[project]
name = "accessgroundbench"
version = "0.1.0"
description = "A benchmark for accessibility-aware visual grounding"
readme = "README.md"
requires-python = ">=3.11"
# Table form rather than the PEP 639 SPDX string: the test suite builds a wheel
# with --no-build-isolation, so it uses whatever setuptools the venv has (65.x),
# which predates PEP 639. The string form fails there.
license = { text = "MIT" }
authors = [
    { name = "Andres Blanco" },
    { name = "Minh Le" },
    { name = "Thy Tang" },
]
keywords = [
    "accessibility",
    "benchmark",
    "vision-language-model",
    "visual-grounding",
    "android",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "litellm>=1.91.3",
    "numpy>=2.4.6",
    "Pillow>=10.0",
    "python-dotenv>=1.0",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
ui = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.urls]
Homepage = "https://github.com/anfebladi/AccessGroundBench"
Repository = "https://github.com/anfebladi/AccessGroundBench"
Documentation = "https://github.com/anfebladi/AccessGroundBench/blob/main/docs/methods.md"
Issues = "https://github.com/anfebladi/AccessGroundBench/issues"

[project.scripts]
agb = "cli:main"
orchestrator = "collection.cli:collect_main"
vlm_evaluator = "evaluation.cli:evaluate_main"
mcnemar_analysis = "analysis.cli:analyze_main"
canonicalize_results = "evaluation.cli:canonicalize_main"
rescore_coords = "evaluation.cli:rescore_main"
layout_modifier = "collection.cli:profile_main"
screenshot_pipeline = "collection.cli:capture_main"
bound_extractor = "collection.cli:extract_main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli", "paths"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["analysis", "analysis.*", "collection", "collection.*", "evaluation", "evaluation.*", "webui", "webui.*"]
namespaces = false
